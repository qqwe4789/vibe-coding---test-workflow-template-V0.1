name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_node: ${{ steps.check.outputs.has_node }}
      has_python: ${{ steps.check.outputs.has_python }}
      node_package_manager: ${{ steps.check.outputs.node_package_manager }}
      node_install_command: ${{ steps.check.outputs.node_install_command }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"

            if [ -f pnpm-lock.yaml ]; then
              echo "node_package_manager=pnpm" >> "$GITHUB_OUTPUT"
              echo "node_install_command=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            elif [ -f yarn.lock ]; then
              echo "node_package_manager=yarn" >> "$GITHUB_OUTPUT"
              echo "node_install_command=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              echo "node_package_manager=npm" >> "$GITHUB_OUTPUT"
              echo "node_install_command=npm ci" >> "$GITHUB_OUTPUT"
            else
              echo "node_package_manager=npm" >> "$GITHUB_OUTPUT"
              echo "node_install_command=npm install" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
            echo "node_package_manager=" >> "$GITHUB_OUTPUT"
            echo "node_install_command=" >> "$GITHUB_OUTPUT"
          fi

          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi

  node:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    env:
      NODE_PACKAGE_MANAGER: ${{ needs.detect.outputs.node_package_manager }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable Corepack for pnpm/yarn
        shell: bash
        run: |
          if [ "$NODE_PACKAGE_MANAGER" = "pnpm" ] || [ "$NODE_PACKAGE_MANAGER" = "yarn" ]; then
            corepack enable
          fi
      - name: Install dependencies
        shell: bash
        run: ${{ needs.detect.outputs.node_install_command }}
      - name: Lint
        shell: bash
        run: |
          if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.lint ? 0 : 1)"; then
            case "$NODE_PACKAGE_MANAGER" in
              pnpm) pnpm lint ;;
              yarn) yarn lint ;;
              *) npm run lint ;;
            esac
          else
            echo "No lint script found, skip"
          fi
      - name: Test
        shell: bash
        run: |
          if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.test ? 0 : 1)"; then
            case "$NODE_PACKAGE_MANAGER" in
              pnpm) pnpm test ;;
              yarn) yarn test ;;
              *) npm test ;;
            esac
          else
            echo "No test script found, skip"
          fi
      - name: Build
        shell: bash
        run: |
          if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.build ? 0 : 1)"; then
            case "$NODE_PACKAGE_MANAGER" in
              pnpm) pnpm build ;;
              yarn) yarn build ;;
              *) npm run build ;;
            esac
          else
            echo "No build script found, skip"
          fi

  python:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install .
          fi
      - name: Lint
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check .
          else
            echo "ruff not installed, skip"
          fi
      - name: Test
        run: |
          if command -v pytest >/dev/null 2>&1; then
            pytest -q
          else
            echo "pytest not installed, skip"
          fi