name: Feature Request
description: 提交一个新功能需求
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景与目标
      description: 业务背景、要解决的问题、目标结果
      placeholder: 我们希望通过这个功能解决...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围与非范围
      description: 本次要做什么 / 明确不做什么
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准（DoD）
      description: 可验证、可测试的验收条件
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: 风险等级
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: 回滚预案
      description: 出现问题时如何快速恢复
      placeholder: Revert PR / 关闭功能开关 / 回退配置
    validations:
      required: true